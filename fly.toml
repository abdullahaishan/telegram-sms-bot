app = "number-platform"
primary_region = "mad"

[build]
  builder = "heroku/buildpacks:20"

[env]
  BOT_TOKEN = "{{env.BOT_TOKEN}}"
  SUPABASE_URL = "{{env.SUPABASE_URL}}"
  SUPABASE_SERVICE_KEY = "{{env.SUPABASE_KEY}}"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512